name: Build StudyMate AI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Generate Windows runner if needed
        shell: pwsh
        run: |
          if (!(Test-Path windows/runner)) { flutter create --platforms=windows . }

      - name: Use StudyMate logo as app icon
        shell: pwsh
        run: |
          Copy-Item assets/branding/studymate_app_icon.ico windows/runner/resources/app_icon.ico -Force

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          flutter analyze --no-pub > analyze.log 2>&1
          Get-Content analyze.log
          Write-Host 'Analyzer finished. Warnings do not stop the build; compile errors do.'
          exit 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: analyze-log
          path: analyze.log
          if-no-files-found: ignore

      - name: Build release
        run: flutter build windows --release

      - name: Build llama-server and whisper-cli from source
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/ggml-org/llama.cpp llama-src
          git clone --depth 1 https://github.com/ggerganov/whisper.cpp whisper-src
          cmake -S llama-src -B llama-build -DGGML_OPENMP=OFF -DLLAMA_OPENSSL=OFF -DLLAMA_CURL=OFF -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DLLAMA_CURL=OFF -DGGML_NATIVE=OFF -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON -DGGML_AVX512=OFF
          cmake --build llama-build --config Release --target llama-server
          cmake -S whisper-src -B whisper-build -DGGML_OPENMP=OFF -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DGGML_NATIVE=OFF -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON -DGGML_AVX512=OFF
          cmake --build whisper-build --config Release --target whisper-cli
          $bin = Join-Path 'build/windows/x64/runner/Release' 'bin'
          New-Item -ItemType Directory -Force -Path $bin | Out-Null
          $llama = Get-ChildItem llama-build -Recurse -Filter llama-server.exe | Select-Object -First 1
          $whisper = Get-ChildItem whisper-build -Recurse -Filter whisper-cli.exe | Select-Object -First 1
          if (-not $llama -or -not $whisper) { throw 'The build did not produce llama-server.exe or whisper-cli.exe' }
          Copy-Item $llama.FullName $bin -Force
          Copy-Item $whisper.FullName $bin -Force
          Get-ChildItem llama-build -Recurse -Filter *.dll | ForEach-Object { Copy-Item $_.FullName $bin -Force }
          Get-ChildItem whisper-build -Recurse -Filter *.dll | ForEach-Object { Copy-Item $_.FullName $bin -Force }
          $omp = Get-ChildItem 'C:\Program Files\Microsoft Visual Studio' -Recurse -Filter vcomp140.dll -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match 'x64' } | Select-Object -First 1
          if ($omp) { Copy-Item $omp.FullName $bin -Force }
          Write-Host 'Files in bin:'
          Get-ChildItem $bin | ForEach-Object { Write-Host "  $($_.Name)" }

      - name: Smoke test - engine starts with a clean PATH
        shell: pwsh
        run: |
          $bin = Join-Path (Resolve-Path 'build/windows/x64/runner/Release') 'bin'
          $saved = $env:PATH
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          try {
            foreach ($exe in 'llama-server.exe', 'whisper-cli.exe') {
              $out = "$env:TEMP\$exe.out"
              $err = "$env:TEMP\$exe.err"
              $p = Start-Process -FilePath (Join-Path $bin $exe) -ArgumentList '--help' -Wait -PassThru -NoNewWindow -RedirectStandardOutput $out -RedirectStandardError $err
              if ($p.ExitCode -ne 0) {
                throw "$exe failed with exit code $($p.ExitCode). $(Get-Content $err -Raw)"
              }
              Write-Host "$exe starts on a clean PATH."
            }
          } finally {
            $env:PATH = $saved
          }

      - name: Add Piper offline voice engine
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri 'https://github.com/rhasspy/piper/releases/download/2023.11.14-2/piper_windows_amd64.zip' -OutFile piper.zip
          Expand-Archive piper.zip -DestinationPath piper-tmp -Force
          $exe = Get-ChildItem piper-tmp -Recurse -Filter piper.exe | Select-Object -First 1
          if (-not $exe) { throw 'piper.exe was not found in the Piper download' }
          $dest = 'build/windows/x64/runner/Release/bin/piper'
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item (Join-Path $exe.DirectoryName '*') $dest -Recurse -Force
          Write-Host 'Piper files:'
          Get-ChildItem $dest | ForEach-Object { Write-Host "  $($_.Name)" }

      - name: Bundle the PDF reader (pdftotext)
        shell: pwsh
        run: |
          $rel = Invoke-RestMethod -Uri 'https://api.github.com/repos/oschwartz10612/poppler-windows/releases/latest' -Headers @{ 'User-Agent'='StudyMate-AI-CI' }
          $asset = $rel.assets | Where-Object { $_.name -match '\.zip$' } | Select-Object -First 1
          if (-not $asset) { throw 'No poppler zip found in the latest release' }
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile poppler.zip
          Expand-Archive -Path poppler.zip -DestinationPath poppler -Force
          $pdf = Get-ChildItem poppler -Recurse -Filter pdftotext.exe | Select-Object -First 1
          if (-not $pdf) { throw 'pdftotext.exe not found in poppler' }
          $bin = Join-Path 'build/windows/x64/runner/Release' 'bin'
          New-Item -ItemType Directory -Force -Path $bin | Out-Null
          Copy-Item $pdf.FullName $bin -Force
          Get-ChildItem $pdf.DirectoryName -Filter '*.dll' | Copy-Item -Destination $bin -Force

      - name: Package ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path 'build/windows/x64/runner/Release/*' -DestinationPath 'StudyMate-AI-Windows.zip' -Force

      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' installer.iss

      - uses: actions/upload-artifact@v4
        with:
          name: StudyMate-AI-Windows
          path: StudyMate-AI-Windows.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: StudyMate-AI-Setup
          path: StudyMate-AI-Setup.exe
          if-no-files-found: error

      - name: Publish Windows release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            StudyMate-AI-Windows.zip
            StudyMate-AI-Setup.exe

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Linux build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev pkg-config clang cmake

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Generate Linux runner if needed
        run: |
          if [ ! -d linux/runner ]; then flutter create --platforms=linux .; fi

      - name: Get dependencies
        run: flutter pub get

      - name: Build Linux release
        run: flutter build linux --release

      - name: Build llama-server and whisper-cli from source
        run: |
          git clone --depth 1 https://github.com/ggml-org/llama.cpp llama-src
          git clone --depth 1 https://github.com/ggerganov/whisper.cpp whisper-src
          cmake -S llama-src -B llama-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DLLAMA_CURL=OFF -DGGML_NATIVE=OFF -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON -DGGML_AVX512=OFF
          cmake --build llama-build --target llama-server
          cmake -S whisper-src -B whisper-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DGGML_NATIVE=OFF -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON -DGGML_AVX512=OFF
          cmake --build whisper-build --target whisper-cli
          BIN=build/linux/x64/release/bundle/bin
          mkdir -p "$BIN"
          cp "$(find llama-build -name llama-server -type f | head -1)" "$BIN/"
          cp "$(find whisper-build -name whisper-cli -type f | head -1)" "$BIN/"
          chmod +x "$BIN"/*

      - name: Add Piper offline voice engine
        run: |
          curl -L -o piper.tar.gz https://github.com/rhasspy/piper/releases/download/2023.11.14-2/piper_linux_x86_64.tar.gz
          tar -xzf piper.tar.gz
          PDEST=build/linux/x64/release/bundle/bin/piper
          mkdir -p "$PDEST"
          cp -r piper/* "$PDEST/"
          test -f "$PDEST/piper"
          chmod +x "$PDEST/piper"

      - name: Assemble Linux package
        run: |
          mkdir -p dist
          cp -r build/linux/x64/release/bundle dist/StudyMate-AI
          cp linux_package/StudyMate-AI.desktop dist/StudyMate-AI/
          cp linux_package/ARCH_INSTALL.txt dist/StudyMate-AI/
          chmod +x dist/StudyMate-AI/studymate_ai
          tar -czf StudyMate-AI-Linux.tar.gz -C dist StudyMate-AI

      - uses: actions/upload-artifact@v4
        with:
          name: StudyMate-AI-Linux
          path: StudyMate-AI-Linux.tar.gz
          if-no-files-found: error

      - name: Publish Linux release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: StudyMate-AI-Linux.tar.gz
