name: Build StudyMate AI - Linux

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Linux build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev pkg-config clang cmake

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Generate Linux runner if needed
        run: |
          if [ ! -d linux/runner ]; then flutter create --platforms=linux .; fi

      - name: Get dependencies
        run: flutter pub get

      - name: Build Linux release
        run: flutter build linux --release

      - name: Build llama-server and whisper-cli from source
        run: |
          git clone --depth 1 https://github.com/ggml-org/llama.cpp llama-src
          git clone --depth 1 https://github.com/ggerganov/whisper.cpp whisper-src
          cmake -S llama-src -B llama-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DLLAMA_CURL=OFF
          cmake --build llama-build --target llama-server
          cmake -S whisper-src -B whisper-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF
          cmake --build whisper-build --target whisper-cli
          BIN=build/linux/x64/release/bundle/bin
          mkdir -p "$BIN"
          LLAMA_BIN="$(find llama-build -name llama-server -type f | head -1)"
          WHISPER_BIN="$(find whisper-build -name whisper-cli -type f | head -1)"
          test -n "$LLAMA_BIN" && test -n "$WHISPER_BIN"
          cp "$LLAMA_BIN" "$BIN/"
          cp "$WHISPER_BIN" "$BIN/"
          chmod +x "$BIN"/*

      - name: Assemble Linux package
        run: |
          mkdir -p dist
          cp -r build/linux/x64/release/bundle dist/StudyMate-AI
          cp linux_package/StudyMate-AI.desktop dist/StudyMate-AI/
          cp linux_package/ARCH_INSTALL.txt dist/StudyMate-AI/
          chmod +x dist/StudyMate-AI/studymate_ai
          tar -czf StudyMate-AI-Linux.tar.gz -C dist StudyMate-AI

      - uses: actions/upload-artifact@v4
        with:
          name: StudyMate-AI-Linux
          path: StudyMate-AI-Linux.tar.gz
          if-no-files-found: error

      - name: Publish Linux release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: StudyMate-AI-Linux.tar.gz
