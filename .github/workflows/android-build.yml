
name: Build StudyMate Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  LLAMA_REF: master
  NDK_VERSION: '28.2.13676358'

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "cmake;3.22.1" "ndk;$NDK_VERSION"

      - name: Generate Android project if needed
        run: |
          if [ ! -f android/app/build.gradle ] && [ ! -f android/app/build.gradle.kts ]; then
            flutter create --platforms=android --project-name studymate_ai .
          fi
          ls android/app/build.gradle*

      - name: Patch Android build for native llama.cpp
        run: python3 scripts/patch_android.py

      - name: Set compileSdk 36 for all plugins
        run: |
          ROOT=android/build.gradle.kts
          if [ ! -f "$ROOT" ]; then ROOT=android/build.gradle; fi

          python3 - "$ROOT" <<'PY'
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          text = path.read_text()

          start = text.find("// COMPILESDK36_BLOCK")
          if start >= 0:
              text = text[:start].rstrip()

          block = """
          // COMPILESDK36_BLOCK
          subprojects {
              plugins.withId("com.android.application") {
                  extensions.configure<com.android.build.api.dsl.ApplicationExtension> {
                      compileSdk = 36
                  }
              }
              plugins.withId("com.android.library") {
                  extensions.configure<com.android.build.api.dsl.LibraryExtension> {
                      compileSdk = 36
                  }
              }
          }
          """

          if path.suffix != ".kts":
              block = '''
          // COMPILESDK36_BLOCK
          subprojects {
              plugins.withId("com.android.application") {
                  extensions.configure(com.android.build.api.dsl.ApplicationExtension) {
                      compileSdk = 36
                  }
              }
              plugins.withId("com.android.library") {
                  extensions.configure(com.android.build.api.dsl.LibraryExtension) {
                      compileSdk = 36
                  }
              }
          }
          '''

          path.write_text(text.rstrip() + "\n\n" + block.lstrip() + "\n")
          print(f"Updated {path}")
          PY

          tail -n 20 "$ROOT"

      - name: Fetch llama.cpp
        run: |
          rm -rf android/app/src/main/cpp/llama.cpp
          git clone --depth 1 --branch "$LLAMA_REF" https://github.com/ggml-org/llama.cpp android/app/src/main/cpp/llama.cpp

      - run: flutter pub get

      - name: Analyze (warnings do not stop the build)
        run: flutter analyze --no-pub || true

      - name: Build APK (arm64)
        run: flutter build apk --release --target-platform android-arm64

      - uses: actions/upload-artifact@v4
        with:
          name: StudyMate-AI-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Publish Android release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          
