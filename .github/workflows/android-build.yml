name: Build StudyMate Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  # Pin this to a llama.cpp release tag or commit you have tested.
  LLAMA_REF: master

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "cmake;3.22.1" "ndk;27.2.12479018"

      - name: Generate Android project if needed
        run: |
          if [ ! -d android ]; then flutter create --platforms=android --project-name studymate_ai .; fi

      - name: Patch Android build for native llama.cpp
        run: python3 scripts/patch_android.py

      - name: Fetch llama.cpp
        run: |
          rm -rf android/app/src/main/cpp/llama.cpp
          git clone --depth 1 --branch "$LLAMA_REF" https://github.com/ggml-org/llama.cpp android/app/src/main/cpp/llama.cpp

      - run: flutter pub get

      - name: Analyze (warnings do not stop the build)
        run: flutter analyze --no-pub || true

      - name: Build APK (arm64)
        run: flutter build apk --release --target-platform android-arm64

      - uses: actions/upload-artifact@v4
        with:
          name: StudyMate-AI-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Publish Android release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
