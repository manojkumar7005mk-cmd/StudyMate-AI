      - name: Set compileSdk 36 for all plugins
        run: |
          ROOT=android/build.gradle.kts
          if [ ! -f "$ROOT" ]; then ROOT=android/build.gradle; fi

          python3 - "$ROOT" <<'PY'
          import pathlib
          import re
          import sys

          path = pathlib.Path(sys.argv[1])
          text = path.read_text()

          text = re.sub(
              r'(?ms)^\s*// COMPILESDK36_BLOCK\s*\n.*?(?=\n\S|\Z)',
              '',
              text
          )

          block = """
          // COMPILESDK36_BLOCK
          subprojects {
              plugins.withId("com.android.application") {
                  extensions.configure<com.android.build.api.dsl.ApplicationExtension> {
                      compileSdk = 36
                  }
              }
              plugins.withId("com.android.library") {
                  extensions.configure<com.android.build.api.dsl.LibraryExtension> {
                      compileSdk = 36
                  }
              }
          }
          """

          if "COMPILESDK36_BLOCK" not in text:
              text += "\\n" + block + "\\n"

          path.write_text(text)
          print(f"Updated {path}")
          PY

          tail -n 20 "$ROOT"
