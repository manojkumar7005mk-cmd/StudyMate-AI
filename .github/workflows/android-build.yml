
name: Build StudyMate Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  LLAMA_REF: master
  NDK_VERSION: '28.2.13676358'

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "cmake;3.22.1" \
            "ndk;$NDK_VERSION"

      - name: Generate Android project if needed
        run: |
          if [ ! -f android/app/build.gradle ] && \
             [ ! -f android/app/build.gradle.kts ]; then
            flutter create --platforms=android --project-name studymate_ai .
          fi

          test -f android/app/build.gradle || \
            test -f android/app/build.gradle.kts

      - name: Patch Android build for native llama.cpp
        run: python3 scripts/patch_android.py

      - name: Set compileSdk 36 for Android plugins
        working-directory: android
        run: |
          python3 <<'PY'
          from pathlib import Path

          root = next(
              (p for p in (Path("build.gradle"), Path("build.gradle.kts"))
               if p.exists()),
              None
          )

          if root is None:
              raise SystemExit("Android root Gradle file not found")

          text = root.read_text()
          marker = "// COMPILESDK36_BLOCK"

          if marker in text:
              text = text[:text.index(marker)].rstrip()

          if root.suffix == ".kts":
              block = r'''
          // COMPILESDK36_BLOCK
          subprojects {
              plugins.withId("com.android.application") {
                  extensions.configure<com.android.build.api.dsl.ApplicationExtension> {
                      compileSdk = 36
                  }
              }
              plugins.withId("com.android.library") {
                  extensions.configure<com.android.build.api.dsl.LibraryExtension> {
                      compileSdk = 36
                  }
              }
          }
          '''
          else:
              block = '''
          // COMPILESDK36_BLOCK
          subprojects {
              plugins.withId("com.android.application") {
                  extensions.configure(com.android.build.api.dsl.ApplicationExtension) {
                      compileSdk = 36
                  }
              }
              plugins.withId("com.android.library") {
                  extensions.configure(com.android.build.api.dsl.LibraryExtension) {
                      compileSdk = 36
                  }
              }
          }
          '''

          root.write_text(text.rstrip() + "\n\n" + block.strip() + "\n")
          print(f"Updated {root}")
          PY

      - name: Fetch llama.cpp
        run: |
          rm -rf android/app/src/main/cpp/llama.cpp
          git clone --depth 1 --branch "$LLAMA_REF" \
            https://github.com/ggml-org/llama.cpp \
            android/app/src/main/cpp/llama.cpp

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Analyze Flutter code
        run: flutter analyze --no-pub || true

      - name: Build release APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: StudyMate-AI-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Publish Android release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          
