name: Build StudyMate AI - Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Generate Windows runner if needed
        shell: pwsh
        run: |
          if (!(Test-Path windows/runner)) { flutter create --platforms=windows . }

      - name: Use StudyMate logo as app icon
        shell: pwsh
        run: |
          if (Test-Path assets/branding/studymate_app_icon.ico) {
            Copy-Item assets/branding/studymate_app_icon.ico windows/runner/resources/app_icon.ico -Force
          } else {
            Write-Host 'Custom icon not found; keeping the generated Windows icon.'
          }

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          flutter analyze --no-pub > analyze.log 2>&1
          Get-Content analyze.log
          Write-Host 'Analyzer warnings do not stop the build; compile errors may.'
          exit 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: analyze-log-windows
          path: analyze.log
          if-no-files-found: ignore

      - name: Build release
        run: flutter build windows --release

      - name: Build llama-server and whisper-cli from source
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/ggml-org/llama.cpp llama-src
          git clone --depth 1 https://github.com/ggerganov/whisper.cpp whisper-src
          cmake -S llama-src -B llama-build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DLLAMA_CURL=OFF
          cmake --build llama-build --config Release --target llama-server
          cmake -S whisper-src -B whisper-build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF
          cmake --build whisper-build --config Release --target whisper-cli
          $bin = Join-Path 'build/windows/x64/runner/Release' 'bin'
          New-Item -ItemType Directory -Force -Path $bin | Out-Null
          $llama = Get-ChildItem llama-build -Recurse -Filter llama-server.exe | Select-Object -First 1
          $whisper = Get-ChildItem whisper-build -Recurse -Filter whisper-cli.exe | Select-Object -First 1
          if (-not $llama -or -not $whisper) { throw 'The build did not produce llama-server.exe or whisper-cli.exe' }
          Copy-Item $llama.FullName $bin -Force
          Copy-Item $whisper.FullName $bin -Force

      - name: Package ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path 'build/windows/x64/runner/Release/*' -DestinationPath 'StudyMate-AI-Windows.zip' -Force

      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' installer.iss

      - uses: actions/upload-artifact@v4
        with:
          name: StudyMate-AI-Windows
          path: StudyMate-AI-Windows.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: StudyMate-AI-Setup
          path: StudyMate-AI-Setup.exe
          if-no-files-found: error

      - name: Publish Windows release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            StudyMate-AI-Windows.zip
            StudyMate-AI-Setup.exe
