name: Build StudyMate AI for Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Generate Windows runner if needed
        shell: pwsh
        run: |
          if (!(Test-Path windows/runner)) { flutter create --platforms=windows . }

      - name: Use StudyMate logo as app icon
        shell: pwsh
        run: |
          Copy-Item assets/branding/studymate_app_icon.ico windows/runner/resources/app_icon.ico -Force

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          flutter analyze --no-pub > analyze.log 2>&1
          Get-Content analyze.log
          Write-Host 'Analyzer finished. Warnings and info messages do not stop the build; real compile errors still do.'
          exit 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: analyze-log
          path: analyze.log
          if-no-files-found: ignore

      - name: Build release
        run: flutter build windows --release

      - name: Download llama.cpp Windows CPU server
        shell: pwsh
        run: |
          $releases = Invoke-RestMethod -Uri 'https://api.github.com/repos/ggml-org/llama.cpp/releases?per_page=10' -Headers @{ 'User-Agent'='StudyMate-AI-CI' }
          $candidates = @()
          foreach ($r in $releases) {
            foreach ($a in $r.assets) {
              if ($a.name -match '(?i)win' -and $a.name -match '(?i)x64|amd64' -and $a.name -match '(?i)\.zip$' -and $a.name -notmatch '(?i)cuda|vulkan|hip|sycl|arm|kompute|rocm') {
                $candidates += $a
              }
            }
            if ($candidates.Count -gt 0) { break }
          }
          Write-Host 'Windows asset names in the last 10 llama.cpp releases:'
          foreach ($r in $releases) {
            foreach ($a in $r.assets) {
              if ($a.name -match '(?i)win') { Write-Host "  $($r.tag_name): $($a.name)" }
            }
          }
          if ($candidates.Count -eq 0) { throw 'No Windows x64 llama.cpp ZIP found. See the asset names printed above.' }
          $asset = $candidates | Where-Object { $_.name -match '(?i)cpu' } | Select-Object -First 1
          if (-not $asset) { $asset = $candidates[0] }
          Write-Host "Downloading $($asset.name)"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile llama-cpp.zip
          Expand-Archive -Path llama-cpp.zip -DestinationPath llama-cpp -Force
          $server = Get-ChildItem llama-cpp -Recurse -Filter llama-server.exe | Select-Object -First 1
          if (-not $server) { throw 'llama-server.exe was not found in the downloaded archive.' }
          $bin = Join-Path (Resolve-Path 'build/windows/x64/runner/Release').Path 'bin'
          New-Item -ItemType Directory -Force -Path $bin | Out-Null
          Copy-Item $server.FullName $bin -Force
          Get-ChildItem $server.DirectoryName -Filter '*.dll' | Copy-Item -Destination $bin -Force
          if (!(Test-Path (Join-Path $bin 'llama-server.exe'))) { throw 'Failed to package llama-server.exe' }

      - name: Package ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path 'build/windows/x64/runner/Release/*' -DestinationPath 'StudyMate-AI-Windows.zip' -Force

      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' installer.iss

      - uses: actions/upload-artifact@v4
        with:
          name: StudyMate-AI-Windows
          path: StudyMate-AI-Windows.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: StudyMate-AI-Setup
          path: StudyMate-AI-Setup.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            StudyMate-AI-Windows.zip
            StudyMate-AI-Setup.exe
