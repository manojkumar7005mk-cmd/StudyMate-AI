name: Build StudyMate AI for Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Generate Windows runner if needed
        shell: pwsh
        run: |
          if (!(Test-Path windows/runner)) { flutter create --platforms=windows . }

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        shell: pwsh
        run: |
          flutter analyze --no-pub 2>&1 | Tee-Object -FilePath analyze.log
          if ($LASTEXITCODE -ne 0) { Write-Host 'Analyzer reported issues; build will continue so diagnostics are available.' }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: analyze-log
          path: analyze.log
          if-no-files-found: ignore

      - name: Build release
        run: flutter build windows --release

      - name: Download llama.cpp Windows CPU server
        shell: pwsh
        run: |
          $releases = Invoke-RestMethod -Uri 'https://api.github.com/repos/ggml-org/llama.cpp/releases?per_page=5' -Headers @{ 'User-Agent'='StudyMate-AI-CI' }
          $asset = $null
          foreach ($r in $releases) {
            $asset = $r.assets | Where-Object {
              $_.name -match '(?i)win' -and
              $_.name -match '(?i)x64|amd64' -and
              $_.name -match '(?i)cpu|avx' -and
              $_.name -match '(?i)\.zip$' -and
              $_.name -notmatch '(?i)cuda|vulkan|hip|sycl|arm'
            } | Select-Object -First 1
            if ($asset) { Write-Host "Using llama.cpp $($r.tag_name): $($asset.name)"; break }
            Write-Host "No match in $($r.tag_name). Assets were:"
            $r.assets | ForEach-Object { Write-Host "  $($_.name)" }
          }
          if (-not $asset) { throw 'No Windows x64 CPU ZIP asset found in the last 5 llama.cpp releases. See the asset list above.' }
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile llama-cpp.zip
          Expand-Archive -Path llama-cpp.zip -DestinationPath llama-cpp -Force
          $server = Get-ChildItem llama-cpp -Recurse -Filter llama-server.exe | Select-Object -First 1
          if (-not $server) { throw 'llama-server.exe was not found in the downloaded archive.' }
          $bin = Join-Path (Resolve-Path 'build/windows/x64/runner/Release').Path 'bin'
          New-Item -ItemType Directory -Force -Path $bin | Out-Null
          Copy-Item $server.FullName $bin -Force
          Get-ChildItem $server.DirectoryName -Filter '*.dll' | Copy-Item -Destination $bin -Force
          if (!(Test-Path (Join-Path $bin 'llama-server.exe'))) { throw 'Failed to package llama-server.exe' }

      - name: Package ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path 'build/windows/x64/runner/Release/*' -DestinationPath 'StudyMate-AI-Windows.zip' -Force

      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' installer.iss

      - uses: actions/upload-artifact@v4
        with:
          name: StudyMate-AI-Windows
          path: StudyMate-AI-Windows.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: StudyMate-AI-Setup
          path: StudyMate-AI-Setup.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            StudyMate-AI-Windows.zip
            StudyMate-AI-Setup.exe
